<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Сертификат няшности кафе La Soleil на nyaaa.moe.">
<title>сертификат няшности - nyaaa.moe</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body class="page-certificate">
<header class="site"><div class="site-inner">
  <a class="logo" href="/">nyaaa<span class="tld">.moe</span> <span>(=^･ω･^=)</span></a>
  <nav class="crumbs" aria-label="Разделы"><a href="/">главная</a><span class="sep">/</span><a href="quiz.html">тесты</a><span class="sep">/</span><a href="nyashki.html">няшки сайта</a><span class="sep">/</span><span class="here">сертификат</span></nav>
</div></header>
<main>
  <p class="kicker">кафе La Soleil · книга няшек</p>
  <h1>сертификат няшности</h1>
  <div class="card certificate-card" id="certificate-card">
    <div class="certificate-cat" aria-hidden="true">(=✧ᆽ✧=)</div>
    <p class="kicker">настоящим удостоверяется</p>
    <h2 id="nickname">загружаем мяу…</h2>
    <p id="certificate-copy">сертификат просыпается.</p>
    <p class="mono muted-small" id="certificate-meta"></p>
  </div>
  <div class="certificate-actions" id="certificate-actions" hidden>
    <button type="button" id="share-button">поделиться</button>
    <a class="btn ghost-link" href="nyashki.html">все няшки сайта</a>
  </div>
  <p class="form-status" id="page-status" role="status"></p>
</main>
<footer class="site"><div class="site-inner"><span>© nyaaa.moe · гладь кота чаще</span><span><a href="guide.html">пройти 10 шагов</a></span></div></footer>
<script src="shared.js"></script>
<script>
'use strict';
const id = new URLSearchParams(location.search).get('id');
const status = $('#page-status');
async function loadCertificate() {
  if (!id || !/^\d{13}-[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/.test(id)) {
    $('#nickname').textContent = 'сертификат не найден';
    $('#certificate-copy').textContent = 'проверь ссылку или загляни в список няшек сайта.';
    return;
  }
  try {
    const response = await fetch(`/api/certificates/${encodeURIComponent(id)}`);
    if (!response.ok) throw new Error('сертификат не найден');
    const cert = await response.json();
    $('#nickname').textContent = cert.nickname;
    $('#certificate-copy').textContent = 'прошёл(ла) все 10 шагов и официально является няшей уровня кафе La Soleil.';
    $('#certificate-meta').textContent = `№ NYA-${cert.id.split('-').at(-1).slice(0, 8).toUpperCase()} · выдан ${new Date(cert.issuedAt).toLocaleDateString('ru-RU')}`;
    $('#certificate-actions').hidden = false;
    document.title = `${cert.nickname} - сертификат няшности · nyaaa.moe`;
  } catch (error) {
    $('#nickname').textContent = 'сертификат не найден';
    $('#certificate-copy').textContent = 'возможно, ссылка неверная или сервер пока спит.';
  }
}
$('#share-button').addEventListener('click', async () => {
  try {
    if (navigator.share) await navigator.share({ title: document.title, url: location.href });
    else { await navigator.clipboard.writeText(location.href); status.textContent = 'ссылка скопирована. мяу!'; }
  } catch (error) {
    if (error.name !== 'AbortError') status.textContent = 'не получилось поделиться ссылкой';
  }
});
loadCertificate();
</script>
</body>
</html>
